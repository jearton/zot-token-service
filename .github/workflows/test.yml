name: 测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: test -z "$(gofmt -l ./src)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./src
